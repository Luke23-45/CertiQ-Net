# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/trainer/base.yaml
#
# Shared PyTorch Lightning Trainer settings.
# Per-datatype hyperparameters (PPO, loss, lagrangian) are now defined
# inside the datatype profile blocks in the experiment config (e.g.
# configs/experiments/main_queueing.yaml under the `qgym:` / `synthetic:`
# keys).
# ──────────────────────────────────────────────────────────────────────────────
trainer:

  # ── PyTorch Lightning Trainer ──────────────────────────────────────────────
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.0        # 0.0 = disabled (PPO uses manual clipping)
  val_check_interval: 0.25      # validate 4× per epoch
  log_every_n_steps: 10

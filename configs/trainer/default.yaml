# @package _global_
# Canonical trainer params - kept self-contained since the legacy
# OmegaConf loader does not resolve Hydra `defaults:` nesting.
trainer:
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.0
  val_check_interval: 0.25
  log_every_n_steps: 10

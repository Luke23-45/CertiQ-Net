# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/trainer/fast_dev.yaml
#
# Fast development / CI preset.
# Deliberately uses CPU + 32-bit so it runs without a GPU on any machine.
# Overrides trainer for PL Trainer and datatype profiles for training params.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - base
  - _self_

trainer:
  # ── Hardware / speed ───────────────────────────────────────────────────────
  max_epochs: 1
  accelerator: cpu
  precision: 32-true

  # ── Logging / validation ───────────────────────────────────────────────────
  gradient_clip_val: 1.0
  val_check_interval: 1.0
  log_every_n_steps: 1

# Override the QGym datatype profile for fast dev
qgym:
  trainer:
    use_ppo: false
    rollout_horizon: 8
    val_horizon_max: 4

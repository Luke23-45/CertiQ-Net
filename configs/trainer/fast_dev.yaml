# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/trainer/fast_dev.yaml
#
# Fast development / CI preset.  Overrides only what differs from base.yaml.
# Deliberately uses CPU + 32-bit so it runs without a GPU on any machine.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - base
  - _self_

trainer:
  # ── Hardware / speed ───────────────────────────────────────────────────────
  max_epochs: 1
  accelerator: cpu
  precision: 32-true

  # ── Logging / validation ───────────────────────────────────────────────────
  gradient_clip_val: 1.0        # use standard clipping (not PPO manual)
  val_check_interval: 1.0       # validate once per epoch only
  log_every_n_steps: 1

  # ── PPO off for speed ──────────────────────────────────────────────────────
  use_ppo: false

  # ── Rollout shortened ─────────────────────────────────────────────────────
  rollout_horizon: 8
  val_horizon_max: 4

# @package _global_
# Quiet cloud/Colab profile.
#
# Suppresses tqdm-style progress bars and Lightning progress bars so
# only structured logs remain in notebook / piped environments.
#
# Use:
#   python -m certiqnet.scripts.train --config-name experiments/main_queueing progress=cloud
progress:
  force_show: false
  leave: false
  dynamic_ncols: false
  ncols: 80
  ascii: true
  mininterval: 0.5

runner:
  show_progress: false

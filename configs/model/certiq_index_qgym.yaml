# @package _global_
model:
  _target_: certiqnet.dispatcher.certiq.index_model.CertiQIndexModel
  hidden_dim: 128
  tau: 1.0
  exploration_temperature: 1.5
  C: 20.0
  beta: 1.0
  encoder_layers: 2
  num_heads: 4
  num_inducing_points: 4
  dropout: 0.0
  cost_fn: sed
  constraint_mode: lagrangian
  cost_learner_hidden_dim: 64
  d_xi: 0
loss:
  omega_bc: 1.0
  omega_action: 1.5
  omega_margin: 0.1
  omega_usage: 0.1
  rollout_weight: 1.0
  policy_kl_weight: 0.05
  value_weight: 1.0
  entropy_weight: 0.02
trainer:
  lr: 0.0001
  weight_decay: 1.0e-05
  rollout_horizon: 64
  gamma: 0.99
  gae_lambda: 0.95
  val_horizon_max: 8
  use_ppo: true
  ppo_epochs: 2
  ppo_clip_epsilon: 0.15
  ppo_manual_clip_val: 5.0
  entropy_warmup_epochs: 20
  imitation_warmup_epochs: 30
  critic_bootstrap_epochs: 3
  imitation_decay_rate: 0.96
  expert_mode: qmd
  entropy_weight: 0.02
lagrangian:
  dual_lambda_lr: 0.01
  dual_lambda_init: 0.0
  dual_lambda_momentum: 0.9
  dual_lr_warmup_steps: 10
  dual_lambda_max: 10.0
  dual_lr_decay: 1.0
  target_kl_cert: 0.01
  initial_policy_kl_weight: 0.05
lam: 0.1286

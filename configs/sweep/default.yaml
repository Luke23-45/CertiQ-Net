# ──────────────────────────────────────────────────────────────────────────────
# configs/sweep/default.yaml
#
# Sweep driver configuration.
# Extracted from the root config.yaml into its own group for clarity.
# Use this file with your sweep launcher (e.g. Hydra multirun, wandb sweep).
# ──────────────────────────────────────────────────────────────────────────────
sweep:
  seeds: [0, 1, 2]                              # random seeds to sweep over
  models: [certiq_index]                         # model configs to sweep
  envs: [family_a, family_b, family_c, family_e] # env configs to sweep

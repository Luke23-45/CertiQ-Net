# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/studies/runner/default.yaml
#
# Runner-level settings consumed by studies.runner.common.run_study_family().
# All values are readable via cfg.studies.runner.*
#
# Override examples:
#   studies.runner.seeds="[42,43,44]"
#   studies.runner.baselines.include="[sed,max_weight]"
#   studies.runner.baselines.exclude="[random]"
#   studies.runner.failure_mode=skip
# ──────────────────────────────────────────────────────────────────────────────
studies:
  runner:
    seeds: [42]                     # list of integer seeds to iterate over

    baselines:
      include: ["*"]                # "*" = all baselines; or ["sed", "max_weight", ...]
      exclude: []                   # blacklist — applied after include filter

    stages: null                    # null = use spec.stages; or ["train", "audit", "baselines"]
    failure_mode: "stop"            # "stop" | "skip" — what to do when a seed fails
    verbose: true                   # enable Rich console output
    tag: null                       # optional string tag attached to this run

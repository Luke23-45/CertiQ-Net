# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/data/qgym.yaml
#
# LightningCLI QGym data module — full production settings.
# All QGymDataModule init_args are explicit here.
# ──────────────────────────────────────────────────────────────────────────────
data:
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    N: 9                           # reentrant_3_hyper: 9 queues, 3 servers
    batch_size: 64
    n_samples: 512
    seed: 42
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 4096
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75      # higher hard-state density for QGym
    adversarial_fraction: 0.25
    synthetic_mix_fraction: 0.0    # QGym is primary source — no synthetic padding
    dataset_name: reentrant_3_hyper  # harder: 9 queues, hyperexponential noise
    auto_collect: true             # auto-collect if missing

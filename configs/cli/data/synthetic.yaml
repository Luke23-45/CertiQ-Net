# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/data/synthetic.yaml
#
# LightningCLI synthetic data module — full production settings.
# All CertiQNetDataModule init_args are explicit here.
# ──────────────────────────────────────────────────────────────────────────────
data:
  class_path: certiqnet.data.synthetic.datamodule.CertiQNetDataModule
  init_args:
    N: 10                          # override per experiment to match env.N
    batch_size: 64
    n_samples: 512
    seed: 42
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 4096
    synthetic_mix_fraction: 0.5
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.5

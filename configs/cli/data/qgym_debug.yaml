# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/data/qgym_debug.yaml
#
# LightningCLI QGym data module — debug / fast-iteration settings.
# Uses the smaller reentrant_2_debug dataset and reduced buffer sizes.
# ──────────────────────────────────────────────────────────────────────────────
data:
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    N: 6                           # small env for fast debug runs
    batch_size: 16
    n_samples: 64
    seed: 42
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 512
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.5
    dataset_name: reentrant_2_debug # centralized registry name
    auto_collect: true             # auto-collect if missing

# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/model/max_pressure.yaml
#
# Maximum Pressure analytic baseline (no learning).
# N must be overridden per experiment to match the environment.
# ──────────────────────────────────────────────────────────────────────────────
model:
  class_path: certiqnet.train.queueing.module.QueueingLightningModule
  init_args:
    lr: 3.0e-4
    rollout_horizon: 16
    use_ppo: false
    lam: 1.0              # override per experiment if env.lam differs
    model:
      class_path: certiqnet.models.baselines.MaximumPressure
      init_args:
        N: 10             # override per experiment to match env.N
        beta: 1.0
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss

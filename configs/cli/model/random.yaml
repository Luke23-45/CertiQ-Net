# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/model/random.yaml
#
# Uniformly-random dispatch baseline (no learning).
# ──────────────────────────────────────────────────────────────────────────────
model:
  class_path: certiqnet.train.queueing.module.QueueingLightningModule
  init_args:
    lr: 3.0e-4
    rollout_horizon: 16
    use_ppo: false
    lam: 1.0              # override per experiment if env.lam differs
    model:
      class_path: certiqnet.models.baselines.RandomPolicy
      init_args:
        beta: 1.0
        C: .inf
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss

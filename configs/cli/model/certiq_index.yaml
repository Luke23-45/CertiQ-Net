# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/model/certiq_index.yaml
#
# CertiQ-Net full model: CertiQIndexModel + QueueingLightningModule + loss.
# All architectural and loss hyperparameters are explicit here.
# ──────────────────────────────────────────────────────────────────────────────
model:
  class_path: certiqnet.train.queueing.module.QueueingLightningModule
  init_args:
    # ── Input normalization ──────────────────────────────────────────────────
    input_normalization: none

    # ── Optimization ─────────────────────────────────────────────────────────
    lr: 3.0e-4
    weight_decay: 1.0e-5

    # ── RL ───────────────────────────────────────────────────────────────────
    rollout_horizon: 64
    gamma: 0.99
    gae_lambda: 0.95
    val_horizon_max: 8

    # ── PPO ──────────────────────────────────────────────────────────────────
    use_ppo: true
    ppo_epochs: 4
    ppo_clip_epsilon: 0.2
    ppo_manual_clip_val: 1.0

    # ── Curriculum ───────────────────────────────────────────────────────────
    entropy_warmup_epochs: 20
    imitation_warmup_epochs: 20
    critic_bootstrap_epochs: 3
    imitation_decay_rate: 0.96
    expert_mode: qmd
    entropy_weight: 0.001

    # ── Lagrangian dual ───────────────────────────────────────────────────────
    dual_lambda_lr: 0.01
    dual_lambda_init: 0.0
    dual_lambda_momentum: 0.9
    dual_lr_warmup_steps: 10
    dual_lambda_max: 10.0
    dual_lr_decay: 1.0
    target_kl_cert: 0.01
    initial_policy_kl_weight: 0.05

    # ── Environment coupling ─────────────────────────────────────────────────
    # lam is env-specific; override per experiment (e.g. family_a → 8.0)
    lam: 1.0

    # ── Neural backbone ──────────────────────────────────────────────────────
    model:
      class_path: certiqnet.dispatcher.certiq.index_model.CertiQIndexModel
      init_args:
        hidden_dim: 128
        tau: 1.0
        exploration_temperature: 1.5
        C: 20.0
        beta: 1.0
        encoder_layers: 2
        num_heads: 4
        num_inducing_points: 4
        dropout: 0.0
        # ── Architecture flags ───────────────────────────────────────────────
        cost_fn: sed               # "sed" | "qmd" | "learned"
        constraint_mode: lagrangian  # "lagrangian" | "unconstrained"
        cost_learner_hidden_dim: 64  # only used when cost_fn = "learned"
        d_xi: 0                    # context dimension (0 = no context)

    # ── Loss ─────────────────────────────────────────────────────────────────
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss
      init_args:
        omega_bc: 1.0
        omega_action: 1.5
        omega_margin: 0.1
        omega_usage: 0.1
        rollout_weight: 1.0
        policy_kl_weight: 0.05
        value_weight: 1.0
        entropy_weight: 0.001

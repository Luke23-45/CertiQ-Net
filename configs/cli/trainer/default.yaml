# ──────────────────────────────────────────────────────────────────────────────
# configs/cli/trainer/default.yaml
#
# LightningCLI trainer preset.  All parameters that BaseCertiQLightningModule
# accepts are listed here so they are explicit and overridable via CLI.
# ──────────────────────────────────────────────────────────────────────────────
seed_everything: 42

trainer:
  # ── PyTorch Lightning Trainer ──────────────────────────────────────────────
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.0
  val_check_interval: 0.25
  log_every_n_steps: 10

  # ── Optimization ───────────────────────────────────────────────────────────
  lr: 3.0e-4
  weight_decay: 1.0e-5

  # ── RL / Rollout ───────────────────────────────────────────────────────────
  rollout_horizon: 64
  gamma: 0.99                    # RL discount factor
  gae_lambda: 0.95               # GAE trace-decay λ
  val_horizon_max: 8             # cap on validation rollout steps

  # ── PPO ────────────────────────────────────────────────────────────────────
  use_ppo: true
  ppo_epochs: 4
  ppo_clip_epsilon: 0.2
  ppo_manual_clip_val: 1.0

  # ── Curriculum / Warmup ────────────────────────────────────────────────────
  entropy_warmup_epochs: 20
  imitation_warmup_epochs: 20
  critic_bootstrap_epochs: 3
  imitation_decay_rate: 0.96
  expert_mode: qmd

  # ── Lagrangian Dual Variable ────────────────────────────────────────────────
  dual_lambda_lr: 0.01
  dual_lambda_init: 0.0
  dual_lambda_momentum: 0.9
  dual_lr_warmup_steps: 10
  dual_lambda_max: 10.0
  dual_lr_decay: 1.0
  target_kl_cert: 0.01
  initial_policy_kl_weight: 0.05

# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/dataset/qgym/default.yaml
#
# QGym-backed data module preset for Hydra-style training.
# The duplicate `qgym:` block that previously mirrored `data:` verbatim
# has been removed — there is now a single canonical `data:` definition.
# ──────────────────────────────────────────────────────────────────────────────
trainer:
  dataset_type: qgym

data:
  mode: static
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    N: ${env.N}
    batch_size: 64
    n_samples: 512
    seed: ${project.seed}
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 4096
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75    # QGym: higher hard-state density
    adversarial_fraction: 0.25
    synthetic_mix_fraction: 0.0  # QGym primary source — no synthetic padding
    dataset_path: dataset/qgym/reentrant_2

# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/dataset/qgym/default.yaml
#
# Legacy QGym data module preset.
# Note: dataset_type is no longer read by pipeline.py — datatype profiles
# in the experiment config are now the single source of truth.
# ──────────────────────────────────────────────────────────────────────────────
data:
  mode: static
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    batch_size: 64
    n_samples: 512
    seed: ${project.seed}
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 4096
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75
    adversarial_fraction: 0.25
    synthetic_mix_fraction: 0.0
    dataset_name: reentrant_3_hyper
    auto_collect: true

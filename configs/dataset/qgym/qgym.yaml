# @package _global_
datasets: {}
datatype: qgym

qgym:
  input_normalization: per_sample
  model:
    context_dim: 8
  data:
    class_path: certiqnet.data.qgym.datamodule.QGymDataModule
    init_args:
      dataset_name: n_model_large
      auto_collect: true
      batch_size: 64
      n_samples: 512
      max_queue: 15
      resample_every_epoch: true
      policy_buffer_max: 4096
      policy_mix_fraction: 0.25
      hard_state_fraction: 0.5
      disagreement_fraction: 0.25
      adversarial_fraction: 0.25
  trainer:
    lr: 1.0e-4
    weight_decay: 1.0e-5
    rollout_horizon: 64
    gamma: 0.99
    val_horizon_max: 128
  loss:
    omega_roll: 1.0
    omega_ent: 0.02
    omega_kl: 0.05

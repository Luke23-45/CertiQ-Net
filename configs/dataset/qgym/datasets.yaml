# Centralised QGym dataset registry — single source of truth for all
# pre-collected datasets.  The ``defaults`` section sets shared parameters
# inherited by every dataset via Python-side deep merge.  Each entry
# under ``datasets`` only needs to specify what differs from the defaults.
#
# ``default`` declares which dataset is the primary / production target.
# Used by ``DatasetRegistry.get_default()`` for CLI arg fallback and
# study-runner default selection.
#
# Adding a new topology:
#   1. Create a YAML anchor: ``new_topology: &nt`` with ``env``, ``env_N``
#      and optionally ``env_mu_fixed`` / ``env_lam``.
#   2. Create a production entry with that anchor (no collection override
#      needed — uses defaults).
#   3. Create a debug entry with ``<<: *nt`` and debug-specific overrides.
#
# Adding a new variant of an existing topology:
#   Use ``<<: <existing_anchor>`` and override only what differs.

default: re-reentrant_3_hyper

defaults:
  output_dir: final_dataset/qgym

  collection:
    n_steps: 500000
    n_valid: 10000
    n_test: 10000
    shard_size: 50000
    seed: 42
    policy: mixed
    policy_weights:
      random: 0.25
      sed: 0.25
      qmd: 0.25
      softmax: 0.25

  training_defaults:
    mode: static
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75
    adversarial_fraction: 0.25

datasets:

  # ── reentrant_2 (6 queues, 2 servers, reentrant ﬂow) ────────────
  reentrant_2: &re2
    env: extern/QGym/configs/env/reentrant_2.yaml
    env_N: 6
    env_mu_fixed: [0.125, 0.5, 0.25, 0.16666667, 0.14285715, 1.0]
    env_lam: 0.128575

  reentrant_2_debug:
    <<: *re2
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # ── reentrant_3_hyper (9 queues, 3 servers, hyperexponential) ──
  reentrant_3_hyper: &re3h
    env: extern/QGym/configs/env/reentrant_3_hyper.yaml
    env_N: 9
    env_mu_fixed: [0.125, 0.5, 0.25, 0.16666667, 0.14285715, 1.0, 0.125, 0.5, 0.25]
    env_lam: 0.128578

  reentrant_3_hyper_debug:
    <<: *re3h
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # ── re-reentrant_3_hyper (9 queues, 3 servers, double reentrant) ─
  re-reentrant_3_hyper: &rre3h
    env: extern/QGym/configs/env/re-reentrant_3_hyper.yaml
    env_N: 9
    env_mu_fixed: [0.125, 0.5, 0.25, 0.16666667, 0.14285715, 1.0, 0.125, 0.5, 0.25]
    env_lam: 0.064294

  re-reentrant_3_hyper_debug:
    <<: *rre3h
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # ── HARD ENVIRONMENTS (heuristics fail) ─────────────────────────────

  # criss_cross_bh: 3 queues, 2 servers, asymmetric bottleneck.
  # SED/MP both degrade catastrophically on this topology.
  criss_cross_bh: &cc_bh
    env: extern/QGym/configs/env/criss_cross_bh.yaml
    env_N: 3
    env_lam: 1.800001

  criss_cross_bh_debug:
    <<: *cc_bh
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # input_switch: 6 queues, 3 servers with disjoint queue-server pairs.
  # Heuristic policies suffer from capacity misallocation.
  input_switch: &is
    env: extern/QGym/configs/env/input_switch.yaml
    env_N: 6
    env_lam: 2.4

  input_switch_debug:
    <<: *is
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # n_model_large: 5 queues, 5 servers with random asymmetric service rates.
  # cmu performs ~3x worse than max-weight on this topology.
  n_model_large: &nml
    env: extern/QGym/configs/env/n_model_large.yaml
    env_N: 5
    env_lam: 3.0478

  n_model_large_debug:
    <<: *nml
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # n_model_giant: 5 queues with fully-connected dense service pool (500+ server types).
  # Massive combinatorial action space; simple heuristics struggle to allocate globally.
  n_model_giant: &nmg
    env: extern/QGym/configs/env/n_model_giant.yaml
    env_N: 5
    env_lam: 3.0022

  n_model_giant_debug:
    <<: *nmg
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # n_model_5x5: 5 queues, 5 servers, N-model routing topology.
  # cmu=17.8 vs MW=15.2 — clear RL advantage.
  n_model_5x5: &nm5
    env: extern/QGym/configs/env/n_model_5x5.yaml
    env_N: 5
    env_lam: 1.615

  n_model_5x5_debug:
    <<: *nm5
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

  # hospital: 9 queues, 13 server types, realistic clinical routing topology.
  # High arrival rates, asymmetric flows — heuristics cannot handle well.
  hospital: &hosp
    env: extern/QGym/configs/env/hospital.yaml
    env_N: 9
    env_lam: 93.2

  hospital_debug:
    <<: *hosp
    collection: {n_steps: 10000, n_valid: 1000, n_test: 1000, shard_size: 5000}

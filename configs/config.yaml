# @package _global_
# Hydra root config fallback used by train.py in legacy mode.

defaults:
  - model: certiq_index
  - adapter: queueing
  - trainer: default
  - logger: csv
  - progress: default
  - runner: default
  - _self_

project:
  name: certiq-index
  seed: 42
  output_root: outputs
  experiment_name: null
  run_id: null
  resume_from_checkpoint: null
  log_dir: null
  save_checkpoints: true

early_stopping:
  enabled: true
  monitor: val/selection_score
  mode: min
  patience: 12
  min_delta: 1.0e-3
  strict: true
  check_finite: true
  check_on_train_epoch_end: false
  verbose: true

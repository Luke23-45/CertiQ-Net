# ──────────────────────────────────────────────────────────────────────────────
# configs/config.yaml  — Hydra root config
#
# This is the fallback root config used by train.py in legacy mode.
# Most real runs use an experiment config (e.g. main_queueing.yaml) which
# explicitly defines datatype profiles.  This root config is minimal and
# requires an override (--config) to pick a datatype.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - model: certiq_index
  - env: synthetic/family_a
  - adapter: queueing
  - trainer: default
  - logger: csv
  - progress: default
  - _self_

project:
  name: certiq-index
  seed: 42
  output_root: outputs
  experiment_name: null
  run_id: null
  resume_from_checkpoint: null
  log_dir: null
  save_checkpoints: true

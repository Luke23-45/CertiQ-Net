# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/main_queueing_optimized.yaml
#
# Study runner config for the optimized queueing family.
# Used by: studies/runner/families/main_queueing_optimized.py
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /model: certiq_index
  - /adapter: queueing
  - /trainer: default
  - /logger: csv
  - /progress: default
  - /runner: default
  - _self_
  - /dataset/qgym: qgym

project:
  name: certiq-net-main-queueing-optimized
  seed: 42
  output_root: outputs
  experiment_name: main_queueing_optimized
  run_id: null
  resume_from_checkpoint: null
  log_dir: null
  save_checkpoints: true

experiment_family: main_queueing_optimized
certificate_status: exact
datatype: qgym

early_stopping:
  enabled: true
  monitor: val/selection_score
  mode: min
  patience: 12
  min_delta: 1.0e-3
  strict: true
  check_finite: true
  check_on_train_epoch_end: false
  verbose: true

# Backwards compatibility block for external scripts (e.g. Colab) 
# that pass --set "studies.runner.baselines.include=[...]"
studies:
  runner:
    baselines:
      include: ["*"]
      exclude: []

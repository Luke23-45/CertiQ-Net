# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/queueing/certiq_index_qgym.yaml
#
# CertiQ-Net training backed by pre-collected QGym states (static mode).
# Inherits the full model from certiq_index and overrides data to QGym.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /trainer: default
  - /model: certiq_index
  - /data: qgym

seed_everything: 42


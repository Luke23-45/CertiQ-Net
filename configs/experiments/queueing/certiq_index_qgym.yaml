# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/queueing/certiq_index_qgym.yaml
#
# CertiQ-Net training backed by pre-collected QGym states (static mode).
# Inherits the full model from certiq_index and overrides data to QGym.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /trainer: default
  - /model: certiq_index
  - /data: qgym

seed_everything: 42

# QGym-specific trainer adjustments
trainer:
  # Slightly higher hard-state fraction when using QGym states
  hard_state_fraction: 0.75
  # No synthetic padding when using QGym as primary data source
  synthetic_mix_fraction: 0.0

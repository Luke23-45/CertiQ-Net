# @package _global_
seed_everything: 42
env:
  N: 6
  mu_mode: fixed
  mu_fixed: [0.125, 0.5, 0.25, 0.16666667, 0.14285715, 1.0]
  lam: 0.8
trainer:
  dataset_type: qgym
  max_epochs: 5
  accelerator: auto
  devices: 1
  precision: 32-true
  gradient_clip_val: 0.0
  val_check_interval: 0.5
  log_every_n_steps: 5
model:
  class_path: certiqnet.train.queueing.module.QueueingLightningModule
  init_args:
    lr: 3.0e-4
    weight_decay: 1.0e-5
    rollout_horizon: 32
    use_ppo: true
    ppo_epochs: 2
    ppo_clip_epsilon: 0.2
    ppo_manual_clip_val: 1.0
    entropy_warmup_epochs: 1
    imitation_warmup_epochs: 1
    entropy_weight: 0.001
    lam: 8.0
    model:
      class_path: certiqnet.dispatcher.certiq.index_model.CertiQIndexModel
      init_args:
        N: 6
        hidden_dim: 32
        tau: 1.0
        exploration_temperature: 1.5
        C: 20.0
        beta: 1.0
        encoder_layers: 1
        num_heads: 2
        num_inducing_points: 2
        dropout: 0.0
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss
      init_args:
        omega_bc: 0.0
        omega_action: 1.5
        omega_margin: 0.1
        omega_usage: 0.1
        rollout_weight: 1.0
        policy_kl_weight: 0.05
        value_weight: 1.0
        entropy_weight: 0.001
data:
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    N: 6
    batch_size: 16
    n_samples: 64
    seed: 42
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 512
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75
    dataset_path: dataset/qgym/reentrant_2_debug
qgym:
  class_path: certiqnet.data.qgym.datamodule.QGymDataModule
  init_args:
    N: 6
    batch_size: 16
    n_samples: 64
    seed: 42
    max_queue: 15
    resample_every_epoch: true
    policy_buffer_max: 512
    teacher_mix_fraction: 0.25
    policy_mix_fraction: 0.25
    hard_state_fraction: 0.75
  mode: static
  dataset_path: dataset/qgym/reentrant_2_debug

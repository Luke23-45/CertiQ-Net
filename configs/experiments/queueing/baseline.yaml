# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/queueing/baseline.yaml
#
# Shared base for all analytic-policy baseline experiments.
# Every baseline inherits this and only overrides the model.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /trainer: default
  - /data: synthetic

seed_everything: 42

# Baselines run for 1 epoch (one rollout for evaluation, no gradient updates)
trainer:
  max_epochs: 1

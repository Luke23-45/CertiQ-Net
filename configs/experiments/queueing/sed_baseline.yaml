seed_everything: 42
trainer:
  dataset_type: synthetic
  max_epochs: 1
  accelerator: auto
  devices: 1
model:
  class_path: certiqnet.train.queueing.module.QueueingLightningModule
  init_args:
    lr: 3.0e-4
    rollout_horizon: 16
    use_ppo: false
    lam: 8.0
    model:
      class_path: certiqnet.models.baselines.sed.ShortestExpectedDelay
      init_args:
        N: 10
        beta: 1.0
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss
data:
  class_path: certiqnet.data.synthetic.datamodule.CertiQNetDataModule
  init_args:
    N: 10
    batch_size: 64
    n_samples: 512
    seed: 42
synthetic:
  class_path: certiqnet.data.synthetic.datamodule.CertiQNetDataModule
  init_args:
    N: 10
    batch_size: 64
    n_samples: 512
    seed: 42

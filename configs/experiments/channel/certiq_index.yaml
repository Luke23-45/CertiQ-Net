# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/channel/certiq_index.yaml
#
# CertiQ-Net training on the channel domain.
# Override the model class and N.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /trainer: default
  - /model: certiq_index
  - /data: synthetic

seed_everything: 42

model:
  class_path: certiqnet.train.channel.module.ChannelLightningModule

# Data: N is set per-run; do not hardcode N inside this experiment config.
# Override via CLI: --data.init_args.N <value>
data:
  init_args:
    N: 10                     # default channel size; override as needed

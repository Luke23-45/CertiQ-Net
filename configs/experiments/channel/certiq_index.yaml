seed_everything: 42
trainer:
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.0
  val_check_interval: 0.25
  log_every_n_steps: 10
model:
  class_path: certiqnet.train.channel.module.ChannelLightningModule
  init_args:
    lr: 3.0e-4
    weight_decay: 1.0e-5
    rollout_horizon: 64
    use_ppo: true
    ppo_epochs: 4
    ppo_clip_epsilon: 0.2
    ppo_manual_clip_val: 1.0
    entropy_warmup_epochs: 20
    imitation_warmup_epochs: 20
    entropy_weight: 0.001
    lam: 1.0
    model:
      class_path: certiqnet.dispatcher.certiq.index_model.CertiQIndexModel
      init_args:
        N: 10
        hidden_dim: 128
        tau: 1.0
        C: 20.0
        beta: 1.0
        encoder_layers: 2
        num_heads: 4
        num_inducing_points: 4
        dropout: 0.0
    loss_fn:
      class_path: certiqnet.train.common.loss.CertiQNetLoss
      init_args:
        omega_bc: 1.0
        omega_action: 1.5
        omega_margin: 0.1
        omega_usage: 0.1
        omega_certificate: 5.0
        omega_correction: 0.01
        rollout_weight: 1.0
        policy_kl_weight: 0.05
        value_weight: 1.0
        entropy_weight: 0.001
data:
  class_path: certiqnet.data.synthetic.datamodule.CertiQNetDataModule
  init_args:
    N: 10
    batch_size: 64
    n_samples: 512
    seed: 42

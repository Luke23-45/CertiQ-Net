# @package _global_
# ──────────────────────────────────────────────────────────────────────────────
# configs/experiments/main_queueing.yaml
#
# Study runner config for the exact-certified queueing family.
# The pipeline reads cfg[datatype] to select data, trainer, and loss parameters.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /model: certiq_index
  - /adapter: queueing
  - /trainer: default
  - /logger: csv
  - /progress: default
  - /runner: default
  - _self_
  - /dataset/qgym: qgym

project:
  name: certiq-net-main-queueing
  seed: 42
  output_root: outputs
  experiment_name: main_queueing
  run_id: null
  resume_from_checkpoint: null
  log_dir: null
  save_checkpoints: true

experiment_family: main_queueing
certificate_status: exact
datatype: qgym

# Backwards compatibility block for external scripts (e.g. Colab) 
# that pass --set "studies.runner.baselines.include=[...]"
studies:
  runner:
    baselines:
      include: ["*"]
      exclude: []
